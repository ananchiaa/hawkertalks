<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hawker Talk: word and sentence practice</title>
<meta name="description" content="Aphasia naming and sentence practice with photos of Singapore hawker food. English and Mandarin. Progress stays on this device.">
<style>
:root{
  --bg:#f6f3ee; --card:#ffffff; --ink:#1f2328; --muted:#535b63; --line:#d9d3c9;
  --pri:#0b5d66; --pri-ink:#ffffff; --pri-soft:#e1efef;
  --ok:#1d6b3a; --ok-soft:#e3f1e7; --warn:#8a4b00; --warn-soft:#fbeedd;
  --focus:#c25e00; --r:16px;
  --fs:clamp(18px,2.2vw,22px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:var(--fs);line-height:1.45}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
h1{font-size:1.7em} h2{font-size:1.35em} h3{font-size:1.1em}
a{color:var(--pri)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .brand{font-weight:700;font-size:1.05em;margin-right:auto;background:none;border:0;padding:8px 4px;cursor:pointer;min-height:48px}
.langsw{display:flex;border:2px solid var(--pri);border-radius:999px;overflow:hidden}
.langsw button{border:0;background:transparent;padding:8px 16px;min-height:48px;min-width:64px;cursor:pointer;font-weight:600;color:var(--pri)}
.langsw button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}
main{max-width:1100px;margin:0 auto;padding:16px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:12px 22px;border-radius:14px;border:2px solid var(--pri);background:var(--card);color:var(--pri);font-weight:650;cursor:pointer;text-align:center;text-decoration:none;font-size:1em}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.small{min-height:48px;padding:8px 14px;font-size:.9em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:1.3em;height:1.3em;flex:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.stack>*+*{margin-top:12px}
.muted{color:var(--muted)}
.stat{font-size:2.2em;font-weight:750;line-height:1}
.statlbl{color:var(--muted);font-size:.85em;margin-top:4px}
.level{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-height:120px;padding:18px;border-radius:var(--r);border:2px solid var(--line);background:var(--card);cursor:pointer;width:100%}
.level:hover{border-color:var(--pri)}
.level .n{font-size:.8em;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.04em}
.level .t{font-size:1.15em;font-weight:700}
.level .d{color:var(--muted);font-size:.85em}
.level .pb{font-size:.85em;margin-top:auto}
.level.rec{border-color:var(--pri);background:var(--pri-soft)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--pri);color:#fff;font-size:.75em;font-weight:700}
/* practice screen */
.practice{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:900px) and (orientation:landscape){.practice{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.progressbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.progressbar>span{display:block;height:100%;background:var(--pri)}
.photo{position:relative;background:#e9e4dc;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{padding:24px;text-align:center;color:var(--muted)}
.credit{font-size:.7em;color:var(--muted);margin-top:6px}
.prompt{font-size:1.6em;font-weight:750;margin:0}
.cue{border-left:6px solid var(--pri);background:var(--pri-soft);padding:12px 16px;border-radius:10px;font-size:1.1em}
.cue .lbl{display:block;font-size:.7em;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.04em}
.answer{font-size:2em;font-weight:800;letter-spacing:.01em}
.answer .py{display:block;font-size:.5em;font-weight:500;color:var(--muted)}
.other{font-size:.8em;color:var(--muted)}
.sentence{font-size:1.45em;font-weight:650}
.blank{display:inline-block;min-width:4em;border-bottom:4px solid var(--ink);margin:0 .2em}
.actions{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
@media (max-width:480px){.actions{grid-template-columns:1fr}}
.actions .btn{min-height:76px;font-size:1.05em}
.stall{background:#fff8ea;border:2px solid #e8c88f;border-radius:var(--r);padding:14px 18px}
.stall .who{font-size:.75em;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:56px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:600;cursor:pointer}
.tiles{display:flex;flex-wrap:wrap;gap:12px;min-height:76px}
.tile{min-height:68px;min-width:68px;padding:10px 18px;border-radius:12px;border:2px solid var(--pri);background:#fff;color:var(--ink);font-size:1.25em;font-weight:700;cursor:pointer}
.tile.hint{box-shadow:0 0 0 5px var(--focus)}
.tile.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.tile.shake{animation:none;background:var(--warn-soft)}}
.built{display:flex;flex-wrap:wrap;gap:10px;min-height:76px;padding:10px;border:2px dashed var(--line);border-radius:12px;align-items:center}
.built span{padding:10px 16px;border-radius:10px;background:var(--ok-soft);font-size:1.25em;font-weight:700}
.feat{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.feat .chip[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok)}
.featrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.featrow .q{font-weight:650}
.featrow .a{color:var(--pri);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:.85em}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#efeae2}
.tablewrap{overflow-x:auto}
label{font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field input[type=text],.field select,.field textarea{min-height:52px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff}
.check{display:flex;gap:12px;align-items:center;min-height:48px}
.check input{width:28px;height:28px}
.itemgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.item{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.item .thumb{aspect-ratio:4/3;background:#e9e4dc;display:flex;align-items:center;justify-content:center;font-size:.8em;color:var(--muted)}
.item .thumb img{width:100%;height:100%;object-fit:cover}
.item .body{padding:10px}
.btn.recording{background:#b3261e;border-color:#b3261e;color:#fff}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.vrow .lbl{font-size:.75em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.vrow .txt{font-weight:650}
.vrow .ok{color:var(--ok);font-weight:700;font-size:.85em}
@media (max-width:640px){.vrow{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 22px;border-radius:12px;z-index:50;max-width:90vw;font-size:.9em}
.note{background:var(--warn-soft);border-radius:12px;padding:12px 16px;font-size:.9em}
.result-big{font-size:3em;font-weight:800;color:var(--pri)}
footer{max-width:1100px;margin:0 auto;padding:0 16px 32px;font-size:.75em;color:var(--muted)}
</style>
</head>
<body>

    <button data-act="lang" data-lang="zh" aria-pressed="false" lang="zh-Hans">中文</button>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<footer id="foot"></footer>
<div id="live" class="sr" aria-live="polite"></div>

  set(k, v){ try{ localStorage.setItem(KEY+"."+k, JSON.stringify(v)); return true; }catch(e){ toast("Could not save on this device (storage full or private browsing)."); return false; } },
  del(k){ try{ localStorage.removeItem(KEY+"."+k); }catch(e){} }
};

function allItems(){ return DISHES.concat(getCustom()); }
function activeItems(){
  const all = allItems();
  if(!Array.isArray(S.active)) return all;
  const on = all.filter(d => S.active.includes(d.id));
  return on.length ? on : all;
}
const L = () => S.lang;
const t = k => (T[L()][k] ?? T.en[k] ?? k);
const nm = d => L()==="zh" ? (d.zh || d.en) : d.en;
const otherNm = d => L()==="zh" ? d.en : (d.zh ? d.zh + (d.py ? " ("+d.py+")" : "") : "");
const f = (d, base) => L()==="zh" ? (d[base+"Zh"] || d[base+"En"] || "") : (d[base+"En"] || "");
const words = s => (s||"").split("|").filter(Boolean);
const joinW = arr => L()==="zh" ? arr.join("") : arr.join(" ");
const plain = s => joinW(words(s));
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function tpl(s, o){ return s.replace(/\{(\w)\}/g, (m,k) => o[k] ?? ""); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function today(d=new Date()){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function money(p){
  if(L()==="en") return "$" + p.toFixed(2);
  const n = Math.round(p*10), dollars = Math.floor(n/10), dimes = n%10;
  return zhNum(dollars) + "块" + (dimes ? zhNum(dimes) : "");
}
function zhNum(n){
  const d = "零一二三四五六七八九";
  if(n < 10) return n===2 ? "两" : d[n];
  if(n < 20) return "十" + (n%10 ? d[n%10] : "");
  if(n < 100) return d[Math.floor(n/10)] + "十" + (n%10 ? d[n%10] : "");
  return String(n);
}

/* ---------- speech ---------- */
let voices = [];
function loadVoices(){ try{ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }catch(e){ voices = []; } }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang){
  const pref = lang==="zh" ? ["zh-SG","zh-CN","cmn-Hans-CN","zh-TW","zh-HK","zh"] : ["en-SG","en-GB","en-AU","en-US","en"];
  for(const p of pref){ const v = voices.find(v => v.lang && v.lang.replace("_","-").toLowerCase().startsWith(p.toLowerCase())); if(v) return v; }
  return null;
}
let warnedVoice = {};
/* Returns true if something will be heard. */
function speak(text, lang=L()){
  if(!text) return false;
  stopAudio();
  const clip = VOICE.url(lang, text);
  if(clip){ try{ curAudio = new Audio(clip); curAudio.play().catch(() => {}); return true; }catch(e){} }
  if(S.voiceMode === "mine") return false;
  if(!("speechSynthesis" in window)) return false;
  try{
    const u = new SpeechSynthesisUtterance(String(text).replace(/\s*_+\s*/g, L()==="zh" ? "，……" : ", … ").replace(/…$/,"").replace(/…/g,""));
    const v = pickVoice(lang);
    u.lang = lang==="zh" ? "zh-CN" : "en-GB";
    if(v) u.voice = v;
    else if(voices.length && !warnedVoice[lang]){ warnedVoice[lang]=true; toast(t("noVoice")); return; }
    u.rate = Number(S.rate) || 0.85;
    speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; /* sound is optional */ }
}
let curAudio = null;
function stopAudio(){
  try{ if(curAudio){ curAudio.pause(); curAudio = null; } }catch(e){}
  try{ if("speechSynthesis" in window) speechSynthesis.cancel(); }catch(e){}
}

/* ---------- your own voice: recordings in IndexedDB, keyed by language + exact text ---------- */
const clipKey = (lang, text) => lang + "|" + String(text).replace(/\s+/g," ").replace(/[\s.。!！?？…]+$/,"").trim().toLowerCase();
const VOICE = {
  db:null, urls:new Map(), ready:null,
  open(){
    if(this.ready) return this.ready;
    this.ready = new Promise(res => {
      try{
        const rq = indexedDB.open("hawkertalk-voice", 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore("clips");
        rq.onsuccess = () => { this.db = rq.result; this.loadAll().then(res); };
        rq.onerror = () => res();
      }catch(e){ res(); }
    });
    return this.ready;
  },
  tx(mode){ return this.db.transaction("clips", mode).objectStore("clips"); },
  loadAll(){
    return new Promise(res => {
      if(!this.db) return res();
      const st = this.tx("readonly"), rq = st.openCursor();
      rq.onsuccess = () => { const c = rq.result; if(c){ this.setUrl(c.key, c.value.blob); c.continue(); } else res(); };
      rq.onerror = () => res();
    });
  },
  setUrl(key, blob){ const old = this.urls.get(key); if(old) URL.revokeObjectURL(old); this.urls.set(key, URL.createObjectURL(blob)); },
  url(lang, text){ return this.urls.get(clipKey(lang, text)) || null; },
  has(lang, text){ return this.urls.has(clipKey(lang, text)); },
  put(lang, text, blob){
    const key = clipKey(lang, text);
    return new Promise((res, rej) => {
      if(!this.db) return rej(new Error("Recordings cannot be saved in this browser."));
      const rq = this.tx("readwrite").put({blob, text, lang, at:Date.now()}, key);
      rq.onsuccess = () => { this.setUrl(key, blob); res(); };
      rq.onerror = () => rej(new Error("Could not save the recording (storage full?)."));
    });
  },
  del(lang, text){
    const key = clipKey(lang, text);
    return new Promise(res => {
      const u = this.urls.get(key); if(u) URL.revokeObjectURL(u); this.urls.delete(key);
      if(!this.db) return res();
      const rq = this.tx("readwrite").delete(key); rq.onsuccess = rq.onerror = () => res();
    });
  },
  all(){
    return new Promise(res => {
      const out = []; if(!this.db) return res(out);
      const rq = this.tx("readonly").openCursor();
      rq.onsuccess = () => { const c = rq.result; if(c){ out.push(c.value); c.continue(); } else res(out); };
      rq.onerror = () => res(out);
    });
  },
  clear(){ return new Promise(res => { this.urls.forEach(u => URL.revokeObjectURL(u)); this.urls.clear(); if(!this.db) return res(); const rq = this.tx("readwrite").clear(); rq.onsuccess = rq.onerror = () => res(); }); }
};
VOICE.open().then(() => { if(screen === "voice" || screen === "settings") render(); });

function recSupported(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }

  if(REC.mr) { stopRec(); return; }
  if(!recSupported()){ toast("Recording is not supported in this browser. Use Safari or Chrome, opened from the https:// web address."); return; }
  stopAudio();
  try{
    REC.stream = REC.stream || await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}});
  }catch(e){ toast("Microphone not available. Allow microphone access for this site, then try again."); return; }
  const types = ["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg"];
  const mime = types.find(tp => { try{ return MediaRecorder.isTypeSupported(tp); }catch(e){ return false; } }) || "";
  try{ REC.mr = mime ? new MediaRecorder(REC.stream, {mimeType:mime}) : new MediaRecorder(REC.stream); }
  catch(e){ toast("Could not start recording."); return; }
  REC.chunks = []; REC.key = {lang, text};
  REC.mr.ondataavailable = e => { if(e.data && e.data.size) REC.chunks.push(e.data); };
  REC.mr.onstop = async () => {
    const blob = new Blob(REC.chunks, {type: REC.mr.mimeType || mime || "audio/webm"});
    const k = REC.key; REC.mr = null; clearTimeout(REC.timer);
    if(blob.size < 800){ toast("That recording was empty. Please try again."); render(); return; }
    try{ await VOICE.put(k.lang, k.text, blob); speak(k.text, k.lang); }catch(err){ toast(err.message); }
    render();
    const btns = [...$app.querySelectorAll('[data-act="rec"]')], i = btns.findIndex(b => b.dataset.text === k.text);
    const nb = btns[i+1] || btns[i]; if(nb) nb.focus({preventScroll:false});
  };
  REC.mr.start();
  REC.timer = setTimeout(stopRec, 15000);
  if(btn){ btn.innerHTML = "<span>■ Stop</span>"; btn.classList.add("recording"); btn.setAttribute("aria-pressed","true"); }
  announce("Recording");
}

/* ---------- live photo lookup (Wikipedia API, CORS via origin=*) ---------- */
const API = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&";
const wikiCache = () => store.get("wikiphotos", {});
let photoLoad = null, photoError = false, lastTry = 0;
function stripHtml(h){ try{ return (new DOMParser().parseFromString(String(h||""), "text/html").body.textContent || "").replace(/\s+/g," ").trim(); }catch(e){ return ""; } }
async function getJson(url){ const r = await fetch(url); if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); }
function loadWikiPhotos(){
  if(photoLoad) return photoLoad;
  const cache = wikiCache(), now = Date.now(), DAY = 86400000;
  const need = Object.keys(WIKI).filter(id => WIKI[id] && !getPhoto(id) && !(cache[id] && (cache[id].src ? now - cache[id].at < 30*DAY : now - cache[id].at < DAY/24)));
  if(!need.length) return Promise.resolve(false);
  if("onLine" in navigator && !navigator.onLine){ if(!photoError){ photoError = true; refreshPhotos(); } return Promise.resolve(false); }
  if(now - lastTry < 60000) return Promise.resolve(false);
  lastTry = now;
  photoLoad = (async () => {
    try{
      const titles = need.map(id => WIKI[id]);
      const q1 = await getJson(API + "redirects=1&prop=pageimages&piprop=name&pilicense=free&titles=" + encodeURIComponent(titles.join("|")));
      const qq = q1.query || {}, hop = {};
      (qq.normalized||[]).concat(qq.redirects||[]).forEach(x => hop[x.from] = x.to);
      const resolve = tt => { let k = tt, n = 0; while(hop[k] && n++ < 5) k = hop[k]; return k; };
      const byTitle = {}; Object.values(qq.pages||{}).forEach(pg => { if(pg.pageimage) byTitle[pg.title] = pg.pageimage; });
      const fileFor = {}; need.forEach(id => { const fn = byTitle[resolve(WIKI[id])]; if(fn) fileFor[id] = fn; });
      const files = [...new Set(Object.values(fileFor))];
      const info = {};
      if(files.length){
        const q2 = await getJson(API + "prop=imageinfo&iiprop=url%7Cextmetadata&iiurlwidth=960&iiextmetadatafilter=Artist%7CLicenseShortName%7CLicenseUrl&titles=" + encodeURIComponent(files.map(f => "File:" + f).join("|")));
        const q2q = q2.query || {}, fhop = {};
        (q2q.normalized||[]).forEach(x => fhop[x.to] = x.from);
        Object.values(q2q.pages||{}).forEach(pg => {
          const ii = pg.imageinfo && pg.imageinfo[0]; if(!ii) return;
          const md = ii.extmetadata || {}, lic = (md.LicenseShortName && md.LicenseShortName.value) || "";
          if(/non-free|fair use|copyrighted/i.test(lic)) return;
          info[String(fhop[pg.title] || pg.title).replace(/^File:/,"").replace(/_/g," ")] = {
            src: ii.thumburl || ii.url, desc: ii.descriptionurl || "", author: stripHtml(md.Artist && md.Artist.value) || "Unknown author",
            licence: stripHtml(lic) || "see file page", licenceUrl: (md.LicenseUrl && md.LicenseUrl.value) || "" };
        });
      }
      const c = wikiCache();
      need.forEach(id => {
        const fn = fileFor[id], inf = fn && info[fn.replace(/_/g," ")];
        c[id] = inf ? Object.assign({file: fn.replace(/_/g," "), article: WIKI[id], at: now}, inf) : {fail:true, at: now};
      });
      store.set("wikiphotos", c);
      photoError = false;
      return true;
    }catch(e){
      photoError = true; refreshPhotos();
      return false;
    }finally{ photoLoad = null; }
  })().then(changed => { if(changed) refreshPhotos(); return changed; });
  return photoLoad;
}

function daysSet(){ return [...new Set(getSessions().map(s => s.day))].sort(); }
function streakNow(){
  const set = new Set(daysSet()); let n = 0; const d = new Date();
  if(!set.has(today(d))) d.setDate(d.getDate()-1);
  while(set.has(today(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function longestStreak(){
  const days = daysSet(); let best = 0, run = 0, prev = null;
  for(const k of days){
    const d = new Date(k+"T12:00:00");
    if(prev && Math.round((d - prev)/86400000) === 1) run++; else run = 1;
    best = Math.max(best, run); prev = d;
  }
  return best;
}

/* ---------- SESSION ---------- */
function pickItems(level, n){
  const key = LEVELS[level].key, hist = {};
  getSessions().filter(s => s.level===key).forEach(s => s.items.forEach(it => { (hist[it.id] = hist[it.id] || []).push(it.score); }));
  const usable = activeItems().filter(hasPhoto);
  const pool = (usable.length ? usable : activeItems()).map(d => {
    const h = hist[d.id]; const mean = h ? h.reduce((a,b)=>a+b,0)/h.length : 0.5;
    return {d, w: mean + Math.random()*0.5};
  }).sort((a,b) => a.w - b.w).map(x => x.d);
  /* hardest and least-practised first; repeat items only if the bank is smaller than the set */
  if(pool.length >= n) return shuffle(pool.slice(0, n));
  /* small bank: cycle through it in rounds, never the same item twice in a row */
  const out = [];
  while(out.length < n){ let r = shuffle(pool); if(r.length > 1 && out.length && r[0] === out[out.length-1]) r.push(r.shift()); out.push(...r); }
  return out.slice(0, n);
}

  SESSION = {level, key:LEVELS[level].key, items, i:0, results:[], start:new Date().toISOString(), lang:L(), id: Date.now().toString(36)};
  screen = "practice"; newStep(); render(); window.scrollTo(0,0);

function buildVariants(d){

/* scoring: item score 0..1. Cue labels kept for the CSV. */
const CUE_LABEL = {name:["independent","semantic cue","first sound cue","written word","repetition after model"],
  complete:["independent","first sound cue","written word","repetition after model"],
  order:["independent","key words","written sentence","repetition after model"]};
function scoreFromCue(key, cue){ const n = CUE_LABEL[key].length; return Math.max(0, (n - cue) / n); }

function recordItem(rec){ SESSION.results.push(Object.assign({id:ST.d.id, item:ST.d.en}, rec)); }
function advance(){
  SESSION.i++;
  if(SESSION.i >= SESSION.items.length){ finishSession(); return; }
  newStep(); render(); focusTop(); speakPrompt();
}
function focusTop(){ const h = $app.querySelector("h1"); if(h) h.focus({preventScroll:true}); window.scrollTo(0,0); }

function finishSession(){
  const res = SESSION.results;
  const pct = res.length ? Math.round(res.reduce((a,r)=>a+r.score,0)/res.length*100) : 0;
  const prevBest = bestFor(SESSION.level);
  const rec = {id:SESSION.id, day:today(), start:SESSION.start, end:new Date().toISOString(), level:SESSION.key, lang:SESSION.lang, pct,
    items: res.map(r => ({id:r.id, item:r.item, detail:r.detail||"", result:r.result, score:Math.round(r.score*100)/100}))};
  const all = getSessions(); all.push(rec);
  if(!store.set("sessions", all)) { /* toast shown */ }
  LAST = {rec, prevBest, level:SESSION.level, weak: res.filter(r => r.score < 0.5).map(r => r.id)};
  SESSION = null; screen = "result"; render(); focusTop();
}
let LAST = null;

  const recent = lastFor(level, 2);

function csvCell(v){ v = String(v ?? ""); if(/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
function exportCsv(){
  const ss = getSessions();
  if(!ss.length){ toast("No sessions to export yet."); return; }
  const head = ["session_id","date","start_time","end_time","level","language","item_no","item","detail","result","item_score_pct","session_score_pct"];
  const lines = [head.join(",")];
  ss.forEach(s => s.items.forEach((it, k) => {
    const st = new Date(s.start), en = new Date(s.end);
    lines.push([s.id, s.day, st.toTimeString().slice(0,5), en.toTimeString().slice(0,5), s.level, s.lang, k+1, it.item, it.detail, it.result, Math.round(it.score*100), s.pct].map(csvCell).join(","));
  }));
  download("hawker-talk-sessions-" + today() + ".csv", "﻿" + lines.join("\r\n"), "text/csv;charset=utf-8");
}

function download(name, text, type){
  try{
    const blob = new Blob([text], {type}); const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; a.textContent = name; a.style.display = "none"; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }catch(e){ toast("Download failed on this browser."); }
}
function importJson(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      if(data.app !== "hawker-talk" || !Array.isArray(data.sessions)) throw new Error("not a Hawker Talk backup");
      const cur = getSessions(), ids = new Set(cur.map(s => s.id));
      const merged = cur.concat(data.sessions.filter(s => s && s.id && !ids.has(s.id) && Array.isArray(s.items)));
      merged.sort((a,b) => String(a.start).localeCompare(String(b.start)));
      store.set("sessions", merged);
      if(Array.isArray(data.custom)){ const cc = getCustom(), cids = new Set(cc.map(c=>c.id)); store.set("custom", cc.concat(data.custom.filter(c => c && c.id && !cids.has(c.id)))); }
      toast("Backup restored: " + (merged.length - cur.length) + " sessions added.");
      render();
    }catch(e){ toast("That file could not be read (" + e.message + ")."); }
  };
  r.onerror = () => toast("That file could not be read.");
  r.readAsText(file);
}

function resizeImage(file, max=900){
  return new Promise((res, rej) => {
    if(!file || !/^image\//.test(file.type)) return rej(new Error("Please choose an image file."));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("That image could not be opened.")); };
    img.src = url;
  });
}

    const id = "custom_" + Date.now().toString(36);
    const zh = g("c_zh").value.trim();
    const item = {id, custom:true, en, zh, py:g("c_py").value.trim(), onEn: en.slice(0, Math.min(3, en.length)) + "…", onZh: zh ? zh[0] : "",
      clueEn:g("c_clue").value.trim(), clueZh:g("c_cluezh").value.trim(), kindEn:g("c_kind").value.trim(), insideEn:g("c_inside").value.trim(),
      tasteEn:g("c_taste").value.trim().split(/\s+/).join("|"), drink:g("c_drink").checked, unitEn: g("c_drink").checked ? "a cup of" : "a plate of", mZh: g("c_drink").checked ? "杯" : "份", price:5};
    if(!store.set("photo."+id, data)) return;
    const cc = getCustom(); cc.push(item);
    if(!store.set("custom", cc)){ store.del("photo."+id); return; }
    if(Array.isArray(S.active)){ S.active.push(id); saveSettings(); }
    toast("Added: " + en); render();
  }catch(e){ err.textContent = e.message; }
}

/* ---------- RECORD MY VOICE ---------- */
let VSEL = "general";
function vRows(groups, lang){
  return groups.map(g => !g.rows.length ? "" : `<h3 style="margin:18px 0 4px">${esc(g.h)}</h3>` + g.rows.map(r => {
    const has = VOICE.has(lang, r.text);
    return `<div class="vrow"><div>${r.lbl ? `<div class="lbl">${esc(r.lbl)}</div>` : ""}<div class="txt">${esc(r.text)}</div>${r.hint ? `<div class="muted" style="font-size:.8em">${esc(r.hint)}</div>` : ""}${has ? `<div class="ok">✓ ${lang==="zh" ? "已录音" : "Recorded"}</div>` : ""}</div>
      <div class="row"><button class="btn small ${has ? "ghost" : "pri"}" data-act="rec" data-text="${esc(r.text)}" aria-pressed="false">● ${has ? (lang==="zh" ? "重录" : "Re-record") : (lang==="zh" ? "录音" : "Record")}</button>
      ${has ? `<button class="btn small" data-act="say" data-text="${esc(r.text)}">${ICON.speaker}<span>${lang==="zh" ? "播放" : "Play"}</span></button><button class="btn small ghost" data-act="delclip" data-text="${esc(r.text)}">${lang==="zh" ? "删除" : "Delete"}</button>`
            : `<button class="btn small ghost" data-act="ttsplay" data-text="${esc(r.text)}">${lang==="zh" ? "电脑语音" : "Computer voice"}</button>`}</div></div>`;
  }).join("")).join("");
}
function countPhrases(){
  const lang = L(), seen = new Set(); let done = 0;
  const add = r => { const k = clipKey(lang, r.text); if(seen.has(k)) return; seen.add(k); if(VOICE.has(lang, r.text)) done++; };
  generalPhrases().forEach(g => g.rows.forEach(add));
  activeItems().forEach(d => phrasesFor(d).forEach(g => g.rows.forEach(add)));
  return {done, total: seen.size};
}
function viewVoice(){
  const lang = L(), items = allItems(), c = countPhrases();
  const sel = VSEL === "general" ? null : items.find(d => d.id === VSEL);
  if(VSEL !== "general" && !sel) VSEL = "general";
  const groups = sel ? phrasesFor(sel) : generalPhrases();
  const opts = `<option value="general" ${VSEL==="general"?"selected":""}>${lang==="zh" ? "通用句子（指示、点餐）" : "General phrases (instructions, ordering)"}</option>` +
    items.map(d => `<option value="${esc(d.id)}" ${VSEL===d.id?"selected":""}>${esc(nm(d))}${VOICE.has(lang, nm(d)) ? " ✓" : ""}</option>`).join("");
  const sup = recSupported() ? "" : `<div class="note" style="margin-bottom:12px">Recording is not available here. Open the app from its https:// web address (for example GitHub Pages) in Safari or Chrome. Opening the file directly may block the microphone.</div>`;
  return `<h1>${lang==="zh" ? "录我自己的声音" : "Record my voice"}</h1>${sup}
  <div class="grid g2" style="margin-bottom:16px">
   <div class="card stack">
    <p style="margin:0">Recording in <strong>${lang==="zh" ? "中文" : "English"}</strong>. Use the language button at the top to record the other language.</p>
    <p style="margin:0"><span class="stat" style="font-size:1.6em">${c.done}</span> <span class="muted">of ${c.total} phrases recorded for the ticked items</span></p>
    <fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:600;margin-bottom:6px">When a phrase is not recorded</legend>
     <label class="check"><input type="radio" name="vm" data-act="setting" data-k="voiceMode" value="mixed" ${S.voiceMode!=="mine"?"checked":""}><span>Use the computer voice</span></label>
     <label class="check"><input type="radio" name="vm" data-act="setting" data-k="voiceMode" value="mine" ${S.voiceMode==="mine"?"checked":""}><span>Stay silent (my voice only)</span></label></fieldset>
   </div>
   <div class="card stack">
    <h2 style="margin:0">Tips</h2>
    <ul style="margin:0;padding-left:1.2em;font-size:.9em">
     <li>Quiet room, tablet about 20 cm away. Each recording stops by itself after 15 seconds.</li>
     <li>Speak naturally, a little slower than usual, the way you would say it at the stall.</li>
     <li>For the first sound, say just that part, e.g. “lak…”.</li>
     <li>Start with the item names and first sounds. These are used most.</li>
    </ul>
   </div>
  </div>
  <div class="card">
   <div class="field"><label for="vsel">${lang==="zh" ? "选择项目" : "Choose what to record"}</label><select id="vsel" data-act="voicesel">${opts}</select></div>
   ${vRows(groups, lang)}
   <div class="row" style="margin-top:16px">${sel ? `<button class="btn" data-act="vnext">${ICON.next}<span>${lang==="zh" ? "下一个项目" : "Next item"}</span></button>` : `<button class="btn" data-act="vnext">${ICON.next}<span>${lang==="zh" ? "开始录项目" : "Start on the items"}</span></button>`}</div>
  </div>
  <div class="card" style="margin-top:16px">
   <h2>Share recordings</h2>
   <p class="muted" style="font-size:.85em">Record once, then load the same voice pack on other tablets. A voice pack holds only your recordings, not any client progress.</p>
   <div class="row"><button class="btn" data-act="voiceexport">Download voice pack</button>
   <label class="btn" style="cursor:pointer">Load voice pack<input type="file" accept=".json,application/json" class="sr" data-act="voiceimport"></label>
   <button class="btn ghost" data-act="voicewipe">Delete all recordings</button></div>
  </div>`;
}
function blobToDataUrl(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
function dataUrlToBlob(u){
  const m = /^data:([^,]*?)(;base64)?,(.*)$/s.exec(u); if(!m) throw new Error("bad audio data");
  const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]); const a = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], {type: m[1] || "audio/webm"});
}
async function exportVoice(){
  const all = await VOICE.all();
  if(!all.length){ toast("No recordings yet."); return; }
  const clips = [];
  for(const c of all) clips.push({lang:c.lang, text:c.text, data: await blobToDataUrl(c.blob)});
  download("hawker-talk-voice-pack-" + today() + ".json", JSON.stringify({app:"hawker-talk-voice", version:1, exported:new Date().toISOString(), clips}), "application/json");
}
function importVoice(file){
  const r = new FileReader();
  r.onload = async () => {
    try{
      const data = JSON.parse(r.result);
      if(data.app !== "hawker-talk-voice" || !Array.isArray(data.clips)) throw new Error("not a Hawker Talk voice pack");
      let n = 0;
      for(const c of data.clips){ if(c && (c.lang==="en" || c.lang==="zh") && c.text && c.data){ await VOICE.put(c.lang, c.text, dataUrlToBlob(c.data)); n++; } }
      toast(n + " recordings loaded."); render();
    }catch(e){ toast("That file could not be read (" + e.message + ")."); }
  };
  r.readAsText(file);
}

/* ---------- CREDITS / ABOUT ---------- */
function viewCredits(){
  const wc = wikiCache();
  const rows = allItems().map(d => {
    const p = photoSrc(d);
    if(p.own) return `<tr><td>${esc(d.en)}</td><td colspan="3">Your own photo (stored on this device only)</td></tr>`;
    const c = p.credit;
    if(!c) return `<tr><td>${esc(d.en)}</td><td colspan="3">${p.pending ? "Not loaded yet (needs internet)" : "No default photo: add your own in Settings"}</td></tr>`;
    const link = c.desc ? `<a href="${esc(c.desc)}" target="_blank" rel="noopener">${esc(c.file || "File page")}</a>` : esc(c.file || c.src || "");
    const lic = c.licenceUrl ? `<a href="${esc(c.licenceUrl)}" target="_blank" rel="noopener">${esc(c.licence)}</a>` : esc(c.licence || "");
    return `<tr><td>${esc(d.en)}</td><td>${link}</td><td>${esc(c.author)}</td><td>${lic}</td></tr>`;
  }).join("");
  return `<h1>${t("credits")}</h1><div class="card"><p>Default photos are the lead photos of the English Wikipedia article for each dish, hosted by Wikimedia and used under their open licences. They are looked up when the app is online and shown cropped to fit; changes to the photos are limited to cropping. Each file link opens the photo’s page with full licence details.</p>
  <div class="tablewrap"><table><thead><tr><th scope="col">Item</th><th scope="col">File</th><th scope="col">Author</th><th scope="col">Licence</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="row" style="margin-top:12px"><button class="btn small" data-act="reloadphotos">Look up default photos again</button></div></div>`;
}
function viewAbout(){
  return `<h1>${t("about")}</h1><div class="card stack">
  <p><strong>Hawker Talk</strong> is a practice tool for adults with aphasia, for use with a speech therapist or for home practice set up by one. It is not a diagnostic or assessment tool.</p>
  <h2>Levels</h2>
  <ol>
   <li><strong>Name it.</strong> Photo naming with a cueing hierarchy: semantic clue, first sound, written word, then a spoken model to repeat.</li>
   <li><strong>Finish the sentence.</strong> Sentence completion with the dish as the target; cues: first sound, written word, model.</li>
   <li><strong>Build a sentence.</strong> Word tiles to put in order, then say the sentence aloud.</li>
   <li><strong>Describe it.</strong> Generate features (kind, contents, taste, when eaten). Mark each one said; using “Show” first counts as half.</li>
   <li><strong>Order at the stall.</strong> A three-turn ordering script with cues: key words, written sentence, model.</li>
  </ol>
  <h2>Scoring</h2>
  <p>Items are scored by the person tapping the buttons, usually the therapist or carer. Naming: 100% with no help, then 80, 60, 40 and 20% after each cue, 0% for “Not yet”. Other levels follow the same idea. The app suggests moving up after two sessions of 80% or more at the suggested level, and an easier level after a session below 40%. These are suggestions only; the therapist decides.</p>
  <h2>Voice</h2>
  <p>Prompts are read aloud in your own recorded voice where one exists (Settings › Record my voice), otherwise by the device’s computer voice. Recordings stay on the device and can be shared between tablets as a voice pack.</p>
  <h2>Privacy</h2>
  <p>No accounts and no names. Everything is stored in this browser’s local storage. Exports contain only dates, items and scores.</p>
  </div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act;
  if(el.tagName==="A" || ["home","progress","settings","credits","about"].includes(a)) { if(el.tagName==="A") e.preventDefault(); }
  if(el.tagName==="INPUT" || (el.tagName==="LABEL")) return; /* handled by change */
  switch(a){
    case "home": go("home"); break;
    case "progress": go("progress"); break;
    case "settings": go("settings"); break;
    case "credits": if(SESSION){ return; } go("credits"); break;
    case "about": go("about"); break;
    case "voice": go("voice"); break;
    case "rec": startRec(L(), el.dataset.text, el); break;
    case "ttsplay": { const m = S.voiceMode; S.voiceMode = "mixed"; const had = VOICE.has(L(), el.dataset.text); if(!had) speak(el.dataset.text); S.voiceMode = m; break; }
    case "delclip": VOICE.del(L(), el.dataset.text).then(render); break;
    case "vnext": { const ids = allItems().map(d => d.id); const i = VSEL === "general" ? -1 : ids.indexOf(VSEL); VSEL = ids[(i+1) % ids.length]; render(); const sel = document.getElementById("vsel"); if(sel) sel.focus(); break; }
    case "voiceexport": exportVoice(); break;
    case "voicewipe": if(!confirmTwice(el)) break; VOICE.clear().then(() => { toast("All recordings deleted."); render(); }); break;
    case "lang":
      if(S.lang === el.dataset.lang) break;
      S.lang = el.dataset.lang; saveSettings();
      if(SESSION){ toast(S.lang==="zh" ? "语言已改变，练习重新开始。" : "Language changed. The set has restarted."); startSession(SESSION.level); }
      else render();
      break;
    case "start": startSession(Number(el.dataset.level)); break;
    case "quit": if(SESSION && SESSION.results.length){ finishSession(); } else go("home"); break;
    case "say": if(!speak(el.dataset.text) && S.voiceMode === "mine") toast(L()==="zh" ? "这句还没有录音。" : "Not recorded yet."); break;
    case "cue": {
      const max = SESSION.key==="name" ? 4 : 3; if(ST.cue >= max) break;
      ST.cue++;
      const list = cuesFor(SESSION.key); const c = list[ST.cue-1];
      render();
      if(SESSION.key==="order"){ if(c==="model" || c==="sent") speak(ST.script[ST.turn].say); }
      else { const s = cueSpeech(ST.d, c); if(s) speak(s); }
      announce(t("help") + " " + ST.cue);
      break; }
    case "got": {
      const k = SESSION.key;
      if(k==="order"){ ST.turnRes.push(scoreFromCue("order", ST.cue)); ST.turnCues = (ST.turnCues||[]).concat(CUE_LABEL.order[ST.cue]); nextTurn(); break; }
      recordItem({result: CUE_LABEL[k][ST.cue], score: scoreFromCue(k, ST.cue), detail: k==="complete" ? clozeText(ST.d) : ""});
      ST.revealed = true; ST.recorded = true; render(); speak(nm(ST.d)); focusTop();
      break; }
    case "notyet": {
      const k = SESSION.key;
      if(k==="order"){ ST.turnRes.push(0); ST.turnCues = (ST.turnCues||[]).concat("not yet"); ST.revealed = true; render(); speak(ST.script[ST.turn].say); break; }
      recordItem({result:"not yet", score:0, detail: k==="complete" ? clozeText(ST.d) : ""});
      ST.revealed = true; ST.recorded = true; render(); speak(nm(ST.d)); focusTop();
      break; }
    case "next": advance(); break;
    case "turnnext": ST.revealed = false; nextTurn(true); break;
    case "tile": {
      const i = Number(el.dataset.i), want = ST.built.length;
      if(i === want){ ST.built.push(i); if(ST.built.length === ST.sentence.length){ finishBuild(); } else render(); focusTile(); }
      else { ST.errors++; ST.posErr = (ST.posErr||0)+1; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); if(ST.posErr >= 2 && !ST.hinted){ ST.hinted = true; render(); focusTile(); } }
      break; }
    case "buildhint": ST.hinted = true; render(); focusTile(); break;
    case "feat": { const k = el.dataset.k; ST.feats[k] = !ST.feats[k]; render(); const b = $app.querySelector(`[data-act="feat"][data-k="${k}"]`); if(b) b.focus(); break; }
    case "showfeat": { const k = el.dataset.k; ST.shown[k] = true; const ans = k==="taste" ? plain(f(ST.d,"taste")) : f(ST.d,k); render(); speak(ans); const b = $app.querySelector(`[data-act="feat"][data-k="${k}"]`); if(b) b.focus(); break; }
    case "descdone": {
      const ks = ["kind","inside","taste","when"].filter(k => k==="taste" ? plain(f(ST.d,"taste")) : f(ST.d,k));
      const pts = ks.reduce((a,k) => a + (ST.feats[k] ? (ST.shown[k] ? 0.5 : 1) : 0), 0);
      const target = Math.min(3, ks.length) || 1;
      const saidList = ks.filter(k => ST.feats[k]).map(k => k + (ST.shown[k] ? " (after showing)" : "")).join("; ");
      recordItem({result: (ks.filter(k=>ST.feats[k]).length) + " features", score: Math.min(1, pts/target), detail: saidList || "none"});
      advance(); break; }
    case "setlevel": S.level = Number(el.dataset.level); saveSettings(); go("home"); break;
    case "csv": exportCsv(); break;
    case "backup": exportJson(); break;
    case "testvoice": { const l = el.dataset.lang; const v = pickVoice(l); speak(l==="zh" ? "老板，我要一盘海南鸡饭。" : "One chicken rice, please.", l); if(!v) toast(l==="zh" ? "没有找到中文语音。" : "No English voice found."); break; }
    case "reloadphotos": store.del("wikiphotos"); photoError = false; lastTry = 0; render(); loadWikiPhotos().then(ok => toast(ok ? "Photos updated." : "Could not reach Wikipedia. Check the internet connection.")); break;
    case "resetphoto": store.del("photo."+el.dataset.id); render(); loadWikiPhotos(); break;
    case "delcustom": { if(!confirmTwice(el)) break; const id = el.dataset.id; store.set("custom", getCustom().filter(c => c.id!==id)); store.del("photo."+id); render(); break; }
    case "allitems": S.active = null; saveSettings(); render(); break;
    case "noitems": S.active = []; saveSettings(); render(); toast("No items ticked: all items will be used until you tick some."); break;
    case "wipe": {
      if(!confirmTwice(el)) break;
      try{ Object.keys(localStorage).filter(k => k.startsWith(KEY+".")).forEach(k => localStorage.removeItem(k)); }catch(e){}
      S = Object.assign({}, DEFAULT_SETTINGS); lastTry = 0; toast("All data on this device has been deleted."); go("home"); break; }
  }
});
/* Two-tap confirm, avoiding blocking browser dialogs */
function confirmTwice(el){
  if(el.dataset.armed === "1") return true;
  el.dataset.armed = "1"; const old = el.innerHTML; el.innerHTML = "<span>Tap again to confirm</span>";
  setTimeout(() => { if(el.isConnected){ el.dataset.armed = ""; el.innerHTML = old; } }, 4000);
  return false;
}
function focusTile(){ const b = $app.querySelector(".tile.hint") || $app.querySelector(".tile") || $app.querySelector('[data-act="next"]'); if(b) b.focus({preventScroll:true}); }
function finishBuild(){
  const sc = ST.hinted ? 0.25 : ST.errors===0 ? 1 : ST.errors===1 ? 0.75 : 0.5;
  recordItem({result: ST.hinted ? "completed with hint" : ST.errors + " errors", score: sc, detail: joinW(ST.sentence)});
  render(); speak(joinW(ST.sentence));
}
function nextTurn(fromReveal){
  if(!fromReveal){ /* got it on this turn */ }
  ST.cue = 0; ST.revealed = false; ST.turn++;
  if(ST.turn >= ST.script.length){
    const sc = ST.turnRes.reduce((a,b)=>a+b,0) / ST.turnRes.length;
    recordItem({result: ST.turnCues.join(" / "), score: sc, detail: ST.script.map(s => s.say).join(" | ")});
    advance(); return;
  }
  render(); speak(ST.script[ST.turn].stall); focusTop();
}
document.addEventListener("change", async e => {
  const el = e.target; const a = el.dataset.act; if(!a) return;
  if(a==="setting"){
    const k = el.dataset.k;
    if(el.type==="radio" && !el.checked) return;
    S[k] = el.type==="checkbox" ? el.checked : (k==="setLen" || k==="level" || k==="rate") ? Number(el.value) : el.value;
    saveSettings(); if(k!=="rate") render(); return;
  }
  if(a==="toggleitem"){
    const all = allItems().map(d => d.id); let act = Array.isArray(S.active) ? S.active.slice() : all.slice();
    if(el.checked){ if(!act.includes(el.dataset.id)) act.push(el.dataset.id); } else act = act.filter(x => x!==el.dataset.id);
    S.active = act.length === all.length ? null : act; saveSettings(); return;
  }
  if(a==="photo"){
    try{ const data = await resizeImage(el.files[0]); if(store.set("photo."+el.dataset.id, data)){ toast("Photo saved on this device."); render(); } }
    catch(err){ toast(err.message); }
    return;
  }
  if(a==="restore"){ if(el.files[0]) importJson(el.files[0]); el.value = ""; }
  if(a==="voicesel"){ VSEL = el.value; render(); const sel = document.getElementById("vsel"); if(sel) sel.focus(); }
  if(a==="voiceimport"){ if(el.files[0]) importVoice(el.files[0]); el.value = ""; }
});
document.addEventListener("input", e => {
  if(e.target.id==="rate"){ S.rate = Number(e.target.value); const v = document.getElementById("rateval"); if(v) v.textContent = S.rate.toFixed(2); saveSettings(); }
});
document.addEventListener("submit", e => { if(e.target.id==="addform"){ e.preventDefault(); addCustom(e.target); } });

render();
loadWikiPhotos();
</script>
